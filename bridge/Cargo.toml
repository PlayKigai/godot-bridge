[package]
name = "godot-bridge"
version.workspace = true
edition.workspace = true

[[bin]]
name = "godot-bridge"
path = "src/main.rs"

[dependencies]
json5 = "0.4"
libc = "0.2"
notify = "8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }

[dev-dependencies]
tempfile = "3"
