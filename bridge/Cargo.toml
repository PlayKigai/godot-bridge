[package]
name = "godot-bridge"
version.workspace = true
edition.workspace = true

[[bin]]
name = "godot-bridge"
path = "src/main.rs"

[dependencies]
anyhow = "1"
blake3 = "1"
clap = { version = "4", features = ["derive"] }
json5 = "0.4"
libc = "0.2"
nix = { version = "0.30", features = ["process", "signal", "fs", "user"] }
notify = "8"
percent-encoding = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
time = { version = "0.3", features = ["formatting", "macros"] }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"

[dev-dependencies]
tempfile = "3"
