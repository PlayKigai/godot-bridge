name: Release

on:
  push:
    tags: ["v[0-9]*.[0-9]*.[0-9]*"]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: sh scripts/check_release_version.sh "$GITHUB_REF_NAME"
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable, 2026-09-05
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2
        with:
          command: check
      - uses: taiki-e/install-action@5bf6ce016fd2e72eefc647cbca1e4213f65955b8 # v2
        with:
          tool: cargo-vet@0.10.2
      - run: cargo vet --locked

  build:
    needs: supply-chain
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            archive: godot-bridge-${{ github.ref_name }}-x86_64-linux.tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: godot-bridge-${{ github.ref_name }}-x86_64-windows.zip
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      TARGET: ${{ matrix.target }}
      ARCHIVE: ${{ matrix.archive }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: sh scripts/check_release_version.sh "$GITHUB_REF_NAME"
        shell: bash
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable, 2026-09-05
        with:
          targets: ${{ matrix.target }}
      - run: cargo fetch --locked
        shell: bash
      - run: python3 scripts/check_build_scripts.py
        shell: bash
      - run: cargo build --release --locked --offline -p godot-bridge --target "$TARGET"
        shell: bash
      - if: runner.os == 'Linux'
        run: tar -C "target/$TARGET/release" -czf "$ARCHIVE" godot-bridge
      - if: runner.os == 'Windows'
        run: Compress-Archive -LiteralPath "target/$env:TARGET/release/godot-bridge.exe" -DestinationPath "$env:ARCHIVE"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: ${{ matrix.archive }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ matrix.archive }}
          path: ${{ matrix.archive }}
          if-no-files-found: error

  vsix:
    needs: supply-chain
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    defaults:
      run:
        working-directory: clients/vscode
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: sh scripts/check_release_version.sh "$GITHUB_REF_NAME"
        working-directory: .
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: clients/vscode/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm audit signatures
      - run: npm run package -- --out "godot-bridge-$GITHUB_REF_NAME.vsix"
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: clients/vscode/godot-bridge-${{ github.ref_name }}.vsix
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: godot-bridge-${{ github.ref_name }}.vsix
          path: clients/vscode/godot-bridge-${{ github.ref_name }}.vsix
          if-no-files-found: error

  release:
    needs: [build, vsix]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: artifacts
          merge-multiple: true
      - run: cd artifacts && sha256sum * > SHA256SUMS
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: artifacts/SHA256SUMS
      - run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" artifacts/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$GITHUB_REF_NAME" artifacts/* --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes
          fi
        env:
          GH_TOKEN: ${{ github.token }}

  crates-io:
    needs: [release]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87 # stable, 2026-09-05
      - id: auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
      - run: |
          ver=${GITHUB_REF_NAME#v}
          published() { curl -sfL -A "godot-bridge release workflow" -o /dev/null "https://crates.io/api/v1/crates/godot-bridge/$ver"; }
          if published; then
            echo "godot-bridge $ver is already on crates.io, nothing to do"
            exit 0
          fi
          cargo publish -p godot-bridge --locked || {
            published && { echo "godot-bridge $ver landed on crates.io anyway"; exit 0; }
            exit 1
          }
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
