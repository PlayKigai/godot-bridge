name = "GDScript"
grammar = "gdscript"
path_suffixes = ["gd"]
line_comments = ["# ", "## "]
autoclose_before = ":.,}])>"
brackets = [
    { start = "[", end = "]", close = true, newline = true },
    { start = "(", end = ")", close = true, newline = true },
    { start = "{", end = "}", close = true, newline = true },
    { start = "\"", end = "\"", close = true, newline = false },
    { start = "'", end = "'", close = true, newline = false },
]
hard_tabs = true
increase_indent_pattern = ":\\s*$"
debuggers = ["godot"]
